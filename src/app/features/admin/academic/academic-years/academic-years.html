<div class="page">

  <app-page-header
    title="Academic Years"
    description="Manage academic years for your institution."
    actionLabel="Add Academic Year"
    [showAction]="true"
    (actionClick)="openAddForm()">
  </app-page-header>


  <!-- FILTERS -->
  <div class="filter-card">

    <app-search-input
      placeholder="Search academic years..."
      [(ngModel)]="searchTerm">
    </app-search-input>

    <select
      class="filter-select"
      [(ngModel)]="statusFilter">

      <option value="ALL">All Status</option>
      <option value="ACTIVE">Active</option>
      <option value="CLOSED">Closed</option>

    </select>

  </div>


  <!-- ERROR -->
  @if (errorMessage) {

    <div class="error-state">
      <span>{{ errorMessage }}</span>
    </div>

  }


  <!-- DATA TABLE -->
<!-- DATA TABLE -->
<app-data-table
  [columns]="columns"
  [data]="filteredYears"
  [loading]="loading"
  [actions]="actions"
  [showActions]="true"
  [enableSearch]="true"
  [searchPlaceholder]="'Search academic years...'"
  currentField="isCurrent"
  (actionClick)="onAction($event)">
</app-data-table>


  <!-- ADD / EDIT MODAL -->
  @if (showForm) {

    <div
      class="modal-backdrop"
      (click)="closeForm()">

      <div
        class="modal"
        (click)="$event.stopPropagation()">


        <!-- MODAL HEADER -->
        <div class="modal-header">

          <div class="modal-title">
            <span class="modal-eyebrow">
              ACADEMIC MANAGEMENT
            </span>

            <h2>
              {{ editingYear ? 'Edit Academic Year' : 'Add Academic Year' }}
            </h2>
          </div>

          <button
            type="button"
            class="close-btn"
            (click)="closeForm()">

            ×

          </button>

        </div>


        <!-- FORM -->
        <form
          (ngSubmit)="saveYear()"
          #academicYearForm="ngForm">


          <!-- ACADEMIC YEAR -->
          <div class="form-group">

            <label>Academic Year</label>

            <input
              type="text"
              name="name"
              placeholder="2026 - 2027"
              [(ngModel)]="form.name"
              required>

          </div>


          <!-- DATES -->
          <div class="form-row">

            <div class="form-group">

              <label>Start Date</label>

              <input
                type="date"
                name="startDate"
                [(ngModel)]="form.startDate"
                required>

            </div>


            <div class="form-group">

              <label>End Date</label>

              <input
                type="date"
                name="endDate"
                [(ngModel)]="form.endDate"
                required>

            </div>

          </div>


          <!-- STATUS -->
          <div class="form-group">

            <label>Status</label>

            <select
              name="status"
              [(ngModel)]="form.status">

              <option value="ACTIVE">Active</option>
              <option value="CLOSED">Closed</option>

            </select>

          </div>


          <!-- ACTIONS -->
          <div class="modal-actions">

            <button
              type="button"
              class="btn-secondary"
              (click)="closeForm()">

              Cancel

            </button>


            <button
              type="submit"
              class="btn-primary"
              [disabled]="academicYearForm.invalid">

              {{ editingYear ? 'Update' : 'Save' }}

            </button>

          </div>


        </form>

      </div>

    </div>

  }

  <app-confirmation-dialog
  [visible]="showDeleteDialog"
  title="Delete Academic Year?"
  [message]="
    'Are you sure you want to delete academic year &quot;' +
    (academicYearToDelete?.name ?? '') +
    '&quot;?'
  "
  confirmLabel="Delete"
  cancelLabel="Cancel"
  [danger]="true"
  (confirmed)="confirmDeleteYear()"
  (cancelled)="cancelDeleteYear()">
</app-confirmation-dialog>

</div>
