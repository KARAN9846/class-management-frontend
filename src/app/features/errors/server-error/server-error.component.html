<main class="server-error-page">

    <div class="server-error-icon" aria-hidden="true">

      <svg
        width="56"
        height="56"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-linejoin="round">

        <path
          d="M12 3L2.5 20h19L12 3z">
        </path>

        <line
          x1="12"
          y1="9"
          x2="12"
          y2="14">
        </line>

        <circle
          cx="12"
          cy="17"
          r="0.7"
          fill="currentColor"
          stroke="none">
        </circle>

      </svg>

    </div>


    <span class="error-code">
      500
    </span>


    <h1>
      Server Error

    <p>
      Something went wrong on our server.

    <a

    </a>
