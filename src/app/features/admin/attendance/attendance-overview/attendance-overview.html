<div class="page">

<div class="page-header">

  <div class="page-title-group">

    <div class="page-title-image">
      <img
        src="/assets/images/attendance.png"
        alt="Attendance"
      />
    </div>

    <div class="page-title-content">
      <h1>Attendance</h1>

      <p>
        View and manage student attendance records
      </p>
    </div>

  </div>

</div>


  <div class="table-card">

    <div class="filter-area">

  <app-search-input
    placeholder="Search attendance..."
    (searchChange)="onSearchChange($event)">
  </app-search-input>

  <select
    class="status-filter"
    [value]="statusFilter"
    (change)="onStatusChange($any($event.target).value)"
  >
    <option value="ALL">All Status</option>
    <option value="PRESENT">Present</option>
    <option value="ABSENT">Absent</option>
  </select>

  <input
  type="date"
  class="date-filter"
  [value]="dateFilter"
  (change)="onDateChange($any($event.target).value)"
/>

<select
  class="class-filter"
  [value]="classFilter"
  (change)="onClassChange($any($event.target).value)"
>
  <option value="ALL">All Classes</option>

  @for (className of classOptions; track className) {
    <option [value]="className">
      {{ className }}
    </option>
  }
</select>

<select
  class="section-filter"
  [value]="sectionFilter"
  (change)="onSectionChange($any($event.target).value)"
>
  <option value="ALL">All Sections</option>

  @for (sectionName of sectionOptions; track sectionName) {
    <option [value]="sectionName">
      {{ sectionName }}
    </option>
  }
</select>

<button
  type="button"
  class="clear-filter-button"
  (click)="clearFilters()"
>
  Clear
</button>

</div>

    @if (errorMessage) {

      <div class="error-state">

        {{ errorMessage }}

      </div>

    }


@if (!loading && attendance.length === 0) {

  <div class="empty-state">
    <h3>No attendance records found</h3>
    <p>
      Try changing your search or filter criteria.
    </p>
  </div>

} @else {

  <app-data-table
    [columns]="columns"
    [data]="attendance"
    [loading]="loading"
    [showActions]="false">
  </app-data-table>

  @if (filteredAttendance.length > 0) {

    <app-pagination
      [currentPage]="currentPage"
      [totalItems]="filteredAttendance.length"
      [pageSize]="pageSize"
      (pageChange)="onPageChange($event)">
    </app-pagination>

  }

}

  </div>

</div>
