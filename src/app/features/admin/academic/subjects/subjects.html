<div class="subjects-page">

  <div class="page-header">
    <div>
      <h1>Subjects</h1>
      <p>Manage subjects for your classes.</p>
    </div>

    <button
      type="button"
      class="btn-primary"
      (click)="openAddForm()">
      + Add Subject
    </button>
  </div>

  <div class="filters-card">

    <input
      class="search-input"
      type="text"
      placeholder="Search subjects..."
      [(ngModel)]="searchTerm">

    <select
      class="filter-select"
      [(ngModel)]="classFilter">

      <option value="ALL">
        All Classes
      </option>

      @for (cls of classes; track cls.id) {
        <option [ngValue]="cls.id">
          {{ cls.name }}
        </option>
      }

    </select>

  </div>

  @if (errorMessage) {
    <div class="error-card">
      {{ errorMessage }}
    </div>
  }

  @if (loading) {
    <div class="state-card">
      Loading subjects...
    </div>
  }

  <div class="table-card">

    <div class="table-header">
      <div>
        <h2>Subjects</h2>
        <span>
          {{ filteredSubjects.length }} records
        </span>
      </div>
    </div>

<div class="table-wrapper">

  <app-data-table
    [columns]="columns"
    [data]="filteredSubjects"
    [loading]="loading"
    [actions]="actions"
    [showActions]="true"
    [enableSearch]="true"
    [searchPlaceholder]="'Search subjects...'"
    (actionClick)="onActionClick($event)">
  </app-data-table>

</div>

  </div>

  @if (showForm) {

    <div
      class="modal-backdrop"
      (click)="closeForm()">

      <div
        class="modal"
        (click)="$event.stopPropagation()">

        <div class="modal-header">

          <h2>
            {{ editingSubject ? 'Edit Subject' : 'Add Subject' }}
          </h2>

          <button
            type="button"
            class="close-btn"
            (click)="closeForm()">
            ×
          </button>

        </div>

        <form
          #subjectForm="ngForm"
          (ngSubmit)="saveSubject()">

          <div class="form-group">

            <label>
              Subject Name
            </label>

            <input
              type="text"
              name="name"
              required
              placeholder="Mathematics"
              [(ngModel)]="form.name">

          </div>

          <div class="form-group">

            <label>
              Code
            </label>

            <input
              type="text"
              name="code"
              required
              placeholder="MATH"
              [(ngModel)]="form.code">

          </div>

          <div class="form-group">

            <label>
              Class
            </label>

            <select
              name="classId"
              [(ngModel)]="form.classId"
              required>

              @for (cls of classes; track cls.id) {

                <option [ngValue]="cls.id">
                  {{ cls.name }}
                </option>

              }

            </select>

          </div>

          <div class="modal-actions">

            <button
              type="button"
              class="btn-secondary"
              (click)="closeForm()">
              Cancel
            </button>

            <button
              type="submit"
              class="btn-primary"
              [disabled]="subjectForm.invalid || saving">

              {{ editingSubject ? 'Update' : 'Save' }}

            </button>

          </div>

        </form>

      </div>

    </div>

  }

  <app-confirmation-dialog
  [visible]="showDeleteDialog"
  title="Delete Subject?"
  [message]="
    'Are you sure you want to delete subject &quot;' +
    (subjectToDelete?.name ?? '') +
    '&quot;?'
  "
  confirmLabel="Delete"
  cancelLabel="Cancel"
  [danger]="true"
  (confirmed)="confirmDeleteSubject()"
  (cancelled)="cancelDeleteSubject()">
</app-confirmation-dialog>
</div>
