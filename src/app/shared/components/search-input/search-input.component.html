<div class="search-input">

  <!-- Search Icon -->
  <svg
    class="search-icon"
    width="18"
    height="18"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
    aria-hidden="true">

    <circle cx="11" cy="11" r="7"></circle>
    <line x1="16.5" y1="16.5" x2="21" y2="21"></line>

  </svg>


  <!-- Input -->
  <input
    type="text"
    [(ngModel)]="searchValue"
    (ngModelChange)="onSearchChange()"
    [placeholder]="placeholder"
    [disabled]="disabled"
    aria-label="Search"
    autocomplete="off"
  />


  <!-- Clear Button -->
  @if (searchValue && !disabled) {

    <button
      type="button"
      class="clear-button"
      aria-label="Clear search"
      (click)="clearSearch()">

      <svg
        width="16"
        height="16"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true">

        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>

      </svg>

    </button>

  }

</div>
