<div class="page">

  <app-page-header
    title="Academic Years"
    description="Manage academic years for your institution."
    actionLabel="Add Academic Year"
    [showAction]="true"
    (actionClick)="openAddForm()">
  </app-page-header>

  <div class="filter-card">
    <app-search-input
      placeholder="Search academic years..."
      [(ngModel)]="searchTerm">
    </app-search-input>

    <select class="filter-select" [(ngModel)]="statusFilter">
      <option value="ALL">All Status</option>
      <option value="ACTIVE">Active</option>
      <option value="CLOSED">Closed</option>
    </select>
  </div>

  @if (errorMessage) {
    <div class="error-state">{{ errorMessage }}</div>
  }

  <app-data-table
    [columns]="columns"
    [data]="filteredYears"
    [loading]="loading"
    [actions]="actions"
    [showActions]="true"
    currentField="isCurrent"
    (actionClick)="onAction($event)">
  </app-data-table>

  @if (showForm) {
    <div class="modal-backdrop" (click)="closeForm()">
      <div class="modal" (click)="$event.stopPropagation()">

        <div class="modal-header">
          <h2>
            {{ editingYear ? 'Edit Academic Year' : 'Add Academic Year' }}
          </h2>

          <button
            type="button"
            class="close-btn"
            (click)="closeForm()">
            ×
          </button>
        </div>

        <form
          (ngSubmit)="saveYear()"
          #academicYearForm="ngForm">

          <div class="form-group">
            <label>Academic Year</label>
            <input
              type="text"
              name="name"
              placeholder="2026 - 2027"
              [(ngModel)]="form.name"
              required>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>Start Date</label>
              <input
                type="date"
                name="startDate"
                [(ngModel)]="form.startDate"
                required>
            </div>

            <div class="form-group">
              <label>End Date</label>
              <input
                type="date"
                name="endDate"
                [(ngModel)]="form.endDate"
                required>
            </div>
          </div>

          <div class="form-group">
            <label>Status</label>

            <select
              name="status"
              [(ngModel)]="form.status">

              <option value="ACTIVE">Active</option>
              <option value="CLOSED">Closed</option>

            </select>
          </div>

          <div class="modal-actions">
            <button
              type="button"
              class="btn-secondary"
              (click)="closeForm()">
              Cancel
            </button>

            <button
              type="submit"
              class="btn-primary"
              [disabled]="academicYearForm.invalid">
              {{ editingYear ? 'Update' : 'Save' }}
            </button>
          </div>

        </form>
      </div>
    </div>
  }
</div>
