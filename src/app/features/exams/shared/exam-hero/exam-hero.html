<section class="exam-hero" [class.exam-hero-compact]="compact">
  <div class="exam-hero-illustration" aria-hidden="true">
    <img
      src="/assets/images/Modern%20Exam%20Dashboard%20Illustration.png"
      alt=""
    />
  </div>

  <div class="exam-hero-content">
    <div class="exam-hero-copy">
      <div class="exam-hero-breadcrumb" aria-label="Breadcrumb">
        <span>{{ eyebrow }}</span>
        <span aria-hidden="true">/</span>
        <strong>{{ title }}</strong>
      </div>
      <h1>{{ title }}</h1>
      <p>{{ subtitle }}</p>
    </div>

    <div class="exam-hero-actions">
      <ng-content />
    </div>
  </div>
</section>
