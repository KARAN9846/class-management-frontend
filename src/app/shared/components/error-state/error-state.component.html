<div
  class="error-state"
  role="alert"
  aria-live="assertive">

  <!-- Error Icon -->
  <div class="error-icon" aria-hidden="true">

    <svg
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.8"
      stroke-linecap="round"
      stroke-linejoin="round">

      <circle
        cx="12"
        cy="12"
        r="9">
      </circle>

      <line
        x1="12"
        y1="8"
        x2="12"
        y2="12">
      </line>

      <circle
        cx="12"
        cy="16"
        r="0.7"
        fill="currentColor"
        stroke="none">
      </circle>

    </svg>

  </div>


  <!-- Content -->
  <div class="error-content">

    <h3 class="error-title">
      {{ title }}
    </h3>

    @if (description) {
      <p class="error-description">
        {{ description }}
      </p>
    }

  </div>


  <!-- Action -->
  @if (showAction && actionLabel) {

    <button
      type="button"
      class="retry-button"
      (click)="onActionClick()"
      [attr.aria-label]="actionLabel">

      <svg
        class="retry-icon"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true">

        <polyline
          points="23 4 23 10 17 10">
        </polyline>

        <path
          d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10">
        </path>

      </svg>

      <span>
        {{ actionLabel }}
      </span>

    </button>

  }

</div>
