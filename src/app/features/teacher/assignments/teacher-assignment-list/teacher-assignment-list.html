<div class="page">

  <!-- =====================================================
       HEADER
  ====================================================== -->

<div class="page-header">

  <div class="page-title-group">

    <div class="page-title-image">

      <img
        src="/assets/images/assignments.png"
        alt="Assignments"
      />

    </div>

    <div class="page-title-content">

      <span class="page-title-eyebrow">
        TEACHER PORTAL
      </span>

      <h1>My Assignments</h1>

      <p>
        Manage assignments created for your classes and subjects
      </p>

    </div>

  </div>

</div>


  <!-- =====================================================
       TABLE
  ====================================================== -->

  <div class="table-card">

    <div class="filter-area">

      <app-search-input
        placeholder="Search my assignments..."
        (searchChange)="onSearch($event)">
      </app-search-input>

    </div>


    <!-- Error -->

    @if (errorMessage) {

      <div class="error-state">

        {{ errorMessage }}

      </div>

    }


    <!-- Data Table -->
<app-data-table

  [columns]="columns"

  [data]="assignments"

  [loading]="loading"

  [actions]="actions"

  [showActions]="true"

  [enableSearch]="true"

  [searchPlaceholder]="'Search assignments...'"

  (actionClick)="onAction($event)">

</app-data-table>

  </div>

</div>
