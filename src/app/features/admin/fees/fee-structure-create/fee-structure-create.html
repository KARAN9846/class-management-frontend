<main class="fee-structure-create-page">

  <!-- PAGE HEADER -->
  <div class="page-header">

    <div>
      <div class="breadcrumb">
        <span>Management</span>
        <span>/</span>
        <span>Fees</span>
        <span>/</span>
        <span>Fee Structure</span>
      </div>

      <h1>Create Fee Structure</h1>

      <p>
        Set the fee amount for a class and academic year.
      </p>
    </div>

  </div>


  <!-- ERROR -->
  <div
    class="error-banner"
    *ngIf="errorMessage"
  >
    {{ errorMessage }}
  </div>


  <!-- LOADING -->
  <div
    class="loading-state"
    *ngIf="loading"
  >
    Loading...
  </div>


  <!-- FORM CARD -->
  <section
    class="form-card"
    *ngIf="!loading"
  >

    <div class="card-header">

      <div>
        <h2>Fee Details</h2>

        <p>
          Configure the fee structure for a class.
        </p>
      </div>

    </div>


    <form
      class="fee-form"
      (ngSubmit)="save()"
    >

      <!-- ACADEMIC YEAR -->
      <div class="form-group">

        <label for="academicYear">
          Academic Year
        </label>

        <select
          id="academicYear"
          name="academicYearId"
          [(ngModel)]="form.academicYearId"
          (ngModelChange)="onAcademicYearChange()"
          [disabled]="saving"
        >

          <option
            [ngValue]="0"
            disabled
          >
            Select Academic Year
          </option>

          <option
            *ngFor="let year of academicYears"
            [ngValue]="year.id"
          >
            {{ year.name }}
          </option>

        </select>

      </div>


      <!-- CLASS -->
      <div class="form-group">

        <label for="class">
          Class
        </label>

        <select
          id="class"
          name="classId"
          [(ngModel)]="form.classId"
          [disabled]="saving || !filteredClasses.length"
        >

          <option
            [ngValue]="0"
            disabled
          >
            Select Class
          </option>

          <option
            *ngFor="let cls of filteredClasses"
            [ngValue]="cls.id"
          >
            {{ cls.name }}
          </option>

        </select>

        <small
          *ngIf="!filteredClasses.length"
          class="field-help"
        >
          No classes are available for this academic year.
        </small>

      </div>


      <!-- FEE AMOUNT -->
      <div class="form-group">

        <label for="feeAmount">
          Fee Amount
        </label>

        <div class="amount-input">

          <span>₹</span>

          <input
            id="feeAmount"
            name="feeAmount"
            type="number"
            min="1"
            step="0.01"
            placeholder="Enter fee amount"
            [(ngModel)]="form.feeAmount"
            [disabled]="saving"
          />

        </div>

        <small class="field-help">
          Enter the total fee amount for this class.
        </small>

      </div>


      <!-- ACTIONS -->
      <div class="form-actions">

        <button
          type="button"
          class="secondary-button"
          (click)="cancel()"
          [disabled]="saving"
        >
          Cancel
        </button>

        <button
          type="submit"
          class="primary-button"
          [disabled]="saving"
        >
          {{ saving ? 'Saving...' : 'Create Fee Structure' }}
        </button>

      </div>

    </form>

  </section>

</main>
