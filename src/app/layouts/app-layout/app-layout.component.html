<div class="app-shell">

  <!-- Mobile Overlay -->
  @if (sidebarOpen) {
    <div
      class="sidebar-overlay"
      (click)="closeSidebar()">
    </div>
  }

  <!-- ================= SIDEBAR ================= -->
  <aside
    class="sidebar"
    [class.sidebar-open]="sidebarOpen">

<!-- Logo -->
<div class="sidebar-brand">

  <div class="brand-logo">
    <img
      src="/assets/images/cms_logo.png"
      alt="CMS Logo"
      class="cms-logo"
    />
  </div>

  <div class="brand-text">
    <strong>CMS</strong>
    <span>Class Management</span>
  </div>

</div>



<!-- Navigation -->
<!-- Navigation -->
<nav class="sidebar-nav">

  @for (section of navigationSections; track section.title) {

    <div class="nav-section">

      <span class="nav-section-title">
        {{ section.title }}
      </span>


      @for (item of section.items; track item.route) {

<a
  [routerLink]="item.route"
  routerLinkActive="active"
  [routerLinkActiveOptions]="{ exact: true }"
  class="nav-item"
  (click)="closeSidebar()"
>

          <span class="nav-icon">
            {{ item.icon }}
          </span>

          <span>
            {{ item.label }}
          </span>

        </a>

      }

    </div>

  }

</nav>

    <!-- Sidebar Bottom -->
    <div class="sidebar-bottom">

      <div
  class="user-card"
  (click)="goToProfile()">

        <div class="user-avatar">
          {{ userInitial }}
        </div>

        <div class="user-info">

          <strong>
            {{ userName }}
          </strong>

          <span>
            {{ userRole }}
          </span>

        </div>

      </div>


    </div>

  </aside>


  <!-- ================= MAIN AREA ================= -->
  <div class="main-area">

    <!-- Header -->
<header class="top-header">

  <div class="header-left">

    <button
      type="button"
      class="menu-button"
      aria-label="Open navigation"
      (click)="toggleSidebar()">

      <span></span>
      <span></span>
      <span></span>

    </button>

  </div>

  <div class="header-search-container">
    <app-global-search></app-global-search>
  </div>

</header>

    <!-- Main Content -->
    <main class="content-area">

      <div class="content-container">

        <router-outlet></router-outlet>

      </div>

    </main>

  </div>

  @if (profileOpen) {
    <app-profile (closeProfile)="profileOpen = false"></app-profile>
  }

</div>
