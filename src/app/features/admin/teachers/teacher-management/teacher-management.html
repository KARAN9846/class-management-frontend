<main class="teacher-management-page">

  <header class="page-header">

  <div class="page-title-group">

    <div class="page-title-image">
      <img
        src="/assets/images/teachers.png"
        alt="Teachers"
      />
    </div>

    <div class="page-title-content">
      <h1>Teachers</h1>

      <p>
        Manage teachers, assignments and academic responsibilities
      </p>
    </div>

  </div>

    <div class="teacher-configuration">

      <div class="configuration-label">
        <span class="configuration-title">
          Teacher Configuration
        </span>

        <span class="configuration-description">
          Manage roles and teacher access
        </span>
      </div>

      <div class="configuration-actions">

        <button
          type="button"
          class="configuration-button"
          (click)="openTeacherRoles()">

          <span class="configuration-icon">♙</span>

          <span class="configuration-button-content">
            <span class="configuration-button-text">
              Teacher Roles
            </span>

            <span class="configuration-button-description">
              Manage roles and permissions
            </span>
          </span>

          <span class="configuration-arrow">
            →
          </span>

        </button>

        <button
          type="button"
          class="configuration-button"
          (click)="openRoleAssignments()">

          <span class="configuration-icon">⇄</span>

          <span class="configuration-button-content">
            <span class="configuration-button-text">
              Role Assignments
            </span>

            <span class="configuration-button-description">
              Assign roles to teachers
            </span>
          </span>

          <span class="configuration-arrow">
            →
          </span>

        </button>

      </div>

    </div>

  </header>


  <section class="teacher-operations">

    <div class="operations-header">

      <div class="operations-title">
        <span class="operations-section-label">
          Teacher Operations
        </span>

        <span class="operations-description">
          Manage class and subject assignments
        </span>
      </div>

      <button
        type="button"
        class="assignment-button"
        (click)="openTeacherAssignments()">

        <span class="assignment-icon">≡</span>

        <span class="assignment-button-content">
          <span class="assignment-button-title">
            Teacher Assignments
          </span>

          <span class="assignment-button-description">
            Manage teacher class and subject assignments
          </span>
        </span>

        <span class="assignment-arrow">
          →
        </span>

      </button>

    </div>

  </section>


  <section class="teacher-list-section">

    <app-teacher-list></app-teacher-list>

  </section>

</main>
