<div class="page">

  <div class="page-header">

    <div>
      <h1>
        {{ isEditMode ? 'Edit Assignment' : 'Create Assignment' }}
      </h1>

      <p>
        {{ isEditMode
          ? 'Update assignment details.'
          : 'Create a new assignment for students.' }}
      </p>
    </div>

  </div>


  @if (errorMessage) {
    <div class="error-state">
      {{ errorMessage }}
    </div>
  }


  @if (loading) {

    <div class="loading-state">
      Loading assignment...
    </div>

  } @else {

    <div class="form-card">

      <!-- ================= ACADEMIC DETAILS ================= -->

      <div class="section-title">
        Academic Details
      </div>


      <div class="form-grid">

        <!-- Academic Year -->

        <div class="form-group">

          <label>
            Academic Year
            <span>*</span>
          </label>

          <select
            [(ngModel)]="form.academicYearId"
            (ngModelChange)="onAcademicYearChange()">

            <option [ngValue]="0">
              Select Academic Year
            </option>

            @for (year of academicYears; track year.id) {

              <option [ngValue]="year.id">
                {{ year.name }}
              </option>

            }

          </select>

        </div>


        <!-- Class -->

        <div class="form-group">

          <label>
            Class
            <span>*</span>
          </label>

          <select
            [(ngModel)]="form.classId"
            (ngModelChange)="onClassChange()"
            [disabled]="!form.academicYearId">

            <option [ngValue]="0">
              Select Class
            </option>

            @for (classItem of classes; track classItem.id) {

              <option [ngValue]="classItem.id">
                {{ classItem.name }}
              </option>

            }

          </select>

        </div>


        <!-- Section -->

        <div class="form-group">

          <label>
            Section
            <span>*</span>
          </label>

          <select
            [(ngModel)]="form.sectionId"
            [disabled]="!form.classId">

            <option [ngValue]="0">
              Select Section
            </option>

            @for (section of sections; track section.id) {

              <option [ngValue]="section.id">
                {{ section.name }}
              </option>

            }

          </select>

        </div>


        <!-- Subject -->

        <div class="form-group">

          <label>
            Subject
            <span>*</span>
          </label>

          <select
            [(ngModel)]="form.subjectId"
            [disabled]="!form.classId">

            <option [ngValue]="0">
              Select Subject
            </option>

            @for (subject of subjects; track subject.id) {

              <option [ngValue]="subject.id">
                {{ subject.name }}
                ({{ subject.code }})
              </option>

            }

          </select>

        </div>


        <!-- Teacher -->

        <div class="form-group">

          <label>
            Teacher
            <span>*</span>
          </label>

          <select
            [(ngModel)]="form.teacherId">

            <option [ngValue]="0">
              Select Teacher
            </option>

            @for (teacher of teachers; track teacher.id) {

              <option [ngValue]="teacher.id">
                {{ teacher.firstName }}
                {{ teacher.lastName }}
              </option>

            }

          </select>

        </div>

      </div>


      <!-- ================= ASSIGNMENT DETAILS ================= -->

      <div class="section-title">
        Assignment Details
      </div>


      <div class="form-grid">

        <!-- Title -->

        <div class="form-group full-width">

          <label>
            Title
            <span>*</span>
          </label>

          <input
            type="text"
            [(ngModel)]="form.title"
            placeholder="Enter assignment title">

        </div>


        <!-- Description -->

        <div class="form-group full-width">

          <label>
            Description
          </label>

          <textarea
            [(ngModel)]="form.description"
            rows="5"
            placeholder="Enter assignment description">
          </textarea>

        </div>


        <!-- Due Date -->

        <div class="form-group">

          <label>
            Due Date
            <span>*</span>
          </label>

          <input
            type="datetime-local"
            [(ngModel)]="form.dueDate">

        </div>


        <!-- Maximum Marks -->

        <div class="form-group">

          <label>
            Maximum Marks
            <span>*</span>
          </label>

          <input
            type="number"
            min="1"
            [(ngModel)]="form.maxMarks"
            placeholder="20">

        </div>


        <!-- Status -->

        @if (isEditMode) {

          <div class="form-group">

            <label>
              Status
            </label>

            <select
              [(ngModel)]="form.status">

              <option value="DRAFT">
                Draft
              </option>

              <option value="PUBLISHED">
                Published
              </option>

              <option value="CLOSED">
                Closed
              </option>

            </select>

          </div>

        }

      </div>


      <!-- ================= ACTIONS ================= -->

      <div class="form-actions">

        <button
          type="button"
          class="cancel-btn"
          (click)="cancel()"
          [disabled]="saving">

          Cancel

        </button>


        <button
          type="button"
          class="save-btn"
          (click)="saveAssignment()"
          [disabled]="saving">

          @if (saving) {
            Saving...
          } @else {
            {{ isEditMode ? 'Update Assignment' : 'Create Assignment' }}
          }

        </button>

      </div>

    </div>

  }

</div>
