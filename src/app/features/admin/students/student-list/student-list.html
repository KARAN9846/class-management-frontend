<div class="page">

  <div class="page-header">

    <div>

      <h1>Students</h1>

      <p>
        Manage all students and their accounts
      </p>

    </div>


    <button
      type="button"
      class="add-btn"
      (click)="router.navigate(['/admin/students/create'])">

      + Add Student

    </button>

  </div>


  <div class="table-card">

<div class="filter-area">

  <app-search-input
    placeholder="Search students..."
    (searchChange)="onSearch($event)">
  </app-search-input>


  <!-- Academic Year -->

  <select
    class="filter-select"
    [value]="selectedAcademicYearId ?? ''"
    (change)="onAcademicYearChange($any($event.target).value)">

    <option value="">
      Academic Year
    </option>

    @for (academicYear of academicYears; track academicYear.id) {

      <option [value]="academicYear.id">
        {{ academicYear.name }}
      </option>

    }

  </select>


  <!-- Class -->

  <select
    class="filter-select"
    [value]="selectedClassId ?? ''"
    [disabled]="selectedAcademicYearId === null"
    (change)="onClassChange($any($event.target).value)">

    <option value="">
      Class
    </option>

    @for (classItem of filteredClasses; track classItem.id) {

      <option [value]="classItem.id">
        {{ classItem.name }}
      </option>

    }

  </select>


  <!-- Section -->

  <select
    class="filter-select"
    [value]="selectedSectionId ?? ''"
    [disabled]="selectedClassId === null"
    (change)="onSectionChange($any($event.target).value)">

    <option value="">
      Section
    </option>

    @for (section of sections; track section.id) {

      <option [value]="section.id">
        {{ section.name }}
      </option>

    }

  </select>


  <!-- Clear -->

  <button
    type="button"
    class="clear-filter-btn"
    (click)="clearFilters()">

    Clear

  </button>

</div>


    @if (errorMessage) {

      <div class="error-state">

        {{ errorMessage }}

      </div>

    }


    <app-data-table

      [columns]="columns"

      [data]="students"

      [loading]="loading"

      [actions]="actions"

      [showActions]="true"

      (actionClick)="onAction($event)">

    </app-data-table>


    <div class="pagination-area">

      <app-pagination

        [currentPage]="page + 1"

        [totalItems]="totalElements"

        [pageSize]="size"

        (pageChange)="onPageChange($event)">

      </app-pagination>

    </div>

  </div>

  <app-confirmation-dialog
  [visible]="showConfirmationDialog"
  [title]="confirmationTitle"
  [message]="confirmationMessage"
  [confirmLabel]="confirmationConfirmLabel"
  cancelLabel="Cancel"
  [danger]="true"
  (confirmed)="confirmAction()"
  (cancelled)="cancelConfirmation()">
</app-confirmation-dialog>

</div>
